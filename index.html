<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Programming Services</title>
    <style>
        /* עיצוב רקע כללי של העמוד כדי שיראה מקצועי */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        /* תיבה שממרכזת את הטופס של גוגל ומעגלת פינות */
        .form-container {
            background-color: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 660px; /* רוחב מותאם לטופס שלך */
            height: 1300px; /* גובה מותאם במיוחד לטופס שלך כדי שלא תהיה גלילה כפולה */
        }
        /* הגדרות עבור הטופס עצמו שימלא את כל התיבה */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="form-container">
    <iframe id="google-form" src="" frameborder="0" marginheight="0" marginwidth="0">טוען... / Loading...</iframe>
</div>

<script>
    // 1. מציאת שפת הדפדפן של המשתמש
    const userLang = navigator.language || navigator.userLanguage;
    const isHebrew = userLang.startsWith('he');

    // 2. הגדרת שפה וכיוון לעמוד הראשי למניעת באגים בתצוגה
    document.documentElement.lang = isHebrew ? 'he' : 'en';
    document.documentElement.dir = isHebrew ? 'rtl' : 'ltr';
    document.title = isHebrew ? "שירותי תכנות אישיים" : "Personal Programming Services";

    // 3. הקישורים של גוגל פורמס
    // כאן כבר השתלתי את הקישור האמיתי שהבאת לטופס בעברית:
    const hebrewFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSf59QroExZuTvPWYJ7EkcNcTS2WUVaKrnpmIaIVWSrWd7katw/viewform?embedded=true";
    
    // כרגע שמתי את אותו הקישור גם לאנגלית כדי שהאתר יעבוד ולא יציג שגיאה לאנשים מחו"ל,
    // ברגע שתכין טופס באנגלית - פשוט תחליף את הקישור במירכאות למטה:
    const englishFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSf59QroExZuTvPWYJ7EkcNcTS2WUVaKrnpmIaIVWSrWd7katw/viewform?embedded=true";

    // 4. הזרקת הקישור המתאים לתוך ה-iframe
    document.getElementById('google-form').src = isHebrew ? hebrewFormUrl : englishFormUrl;
</script>

</body>
</html>
